# ClusterIP: one stable address for metrics scraping and for anything that
# wants a single endpoint. Workers dial the headless Service instead, so they
# reach every broker (see broker-headless-service.yaml). The named metrics port is
# what a ServiceMonitor selects.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hopper.fullname" . }}-broker
  labels:
    {{- include "hopper.labels" (dict "root" . "component" "broker") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "hopper.selectorLabels" (dict "root" . "component" "broker") | nindent 4 }}
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: metrics
      port: 9091
      targetPort: metrics
