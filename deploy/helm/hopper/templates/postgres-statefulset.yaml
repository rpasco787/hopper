apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hopper.fullname" . }}-postgres
  labels:
    {{- include "hopper.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "hopper.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "hopper.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hopper.labels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The alpine image's postgres user is 70. Running as it from the start,
      # instead of letting the entrypoint drop from root, is what lets this pod
      # meet the restricted Pod Security Standard.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hopper.fullname" . }}-postgres
                  key: password
            # A subdirectory: a volume's root can hold lost+found, and initdb
            # refuses a directory that is not empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          # Readiness only. Restarting a database that is slow under load
          # makes the load worse, so there is no liveness probe.
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 2
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "hopper.selectorLabels" (dict "root" . "component" "postgres") | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
