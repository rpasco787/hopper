{{- if .Values.worker.podMonitor.enabled }}
# Prometheus Operator scrape of every worker pod's metrics port, every 5s like
# the brokers. A PodMonitor, because workers have no Service: nothing routes
# to them.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "hopper.fullname" . }}-worker
  labels:
    {{- include "hopper.labels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "hopper.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  podMetricsEndpoints:
    - port: metrics
      interval: 5s
{{- end }}
