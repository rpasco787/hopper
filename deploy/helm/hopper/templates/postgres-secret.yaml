{{- include "hopper.checkPostgres" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hopper.fullname" . }}-postgres
  labels:
    {{- include "hopper.labels" (dict "root" . "component" "postgres") | nindent 4 }}
{{- if eq .Values.postgres.mode "cloudnativepg" }}
# CloudNativePG creates the database owner from this at bootstrap, and reads
# it only in this shape.
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgres.user | quote }}
  password: {{ required "postgres.password is required" .Values.postgres.password | quote }}
{{- else }}
type: Opaque
stringData:
  password: {{ required "postgres.password is required" .Values.postgres.password | quote }}
{{- end }}
