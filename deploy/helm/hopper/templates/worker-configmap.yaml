apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hopper.fullname" . }}-worker
  labels:
    {{- include "hopper.labels" (dict "root" . "component" "worker") | nindent 4 }}
data:
  # Every value is quoted: ConfigMap data must be strings, and the API server
  # rejects a bare number that helm template would happily render.
  HOPPER_BROKER: {{ printf "%s-broker:9090" (include "hopper.fullname" .) | quote }}
  HOPPER_CONCURRENCY: {{ .Values.worker.concurrency | quote }}
  HOPPER_SHUTDOWN_TIMEOUT: {{ printf "%ds" (int .Values.worker.shutdownTimeoutSeconds) | quote }}
  HOPPER_LOG_LEVEL: {{ .Values.worker.logLevel | quote }}
  HOPPER_METRICS_LISTEN: ":9092"
