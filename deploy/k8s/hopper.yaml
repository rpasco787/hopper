# Source: hopper/templates/broker-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hopper-broker
  labels:
    app.kubernetes.io/name: hopper
    app.kubernetes.io/instance: hopper
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hopper-0.1.0
data:
  # No password here: the broker reads it from the Secret as PGPASSWORD, which
  # pgx uses for any connection string that does not carry one.
  HOPPER_DSN: "postgres://hopper@hopper-postgres:5432/hopper?sslmode=disable"
  HOPPER_LISTEN: ":9090"
  HOPPER_METRICS_LISTEN: ":9091"
  HOPPER_METRICS_QUEUES: "sleep,fail_n_times,cpu_burn"
  HOPPER_LEASE_DURATION: "30s"
  HOPPER_LOG_LEVEL: "info"
  HOPPER_SCHEDULER: "true"
  HOPPER_SHUTDOWN_TIMEOUT: "30s"

