apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hopper-postgres
  labels:
    app.kubernetes.io/name: hopper
    app.kubernetes.io/instance: hopper
    app.kubernetes.io/component: postgres
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hopper-0.1.0
spec:
  serviceName: hopper-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hopper
      app.kubernetes.io/instance: hopper
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hopper
        app.kubernetes.io/instance: hopper
        app.kubernetes.io/component: postgres
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: hopper-0.1.0
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The alpine image's postgres user is 70. Running as it from the start,
      # instead of letting the entrypoint drop from root, is what lets this pod
      # meet the restricted Pod Security Standard.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: "hopper"
            - name: POSTGRES_DB
              value: "hopper"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hopper-postgres
                  key: password
            # A subdirectory: a volume's root can hold lost+found, and initdb
            # refuses a directory that is not empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          # Readiness only. Restarting a database that is slow under load
          # makes the load worse, so there is no liveness probe.
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "hopper", "-d", "hopper"]
            periodSeconds: 2
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: hopper
          app.kubernetes.io/instance: hopper
          app.kubernetes.io/component: postgres
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
