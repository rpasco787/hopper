apiVersion: apps/v1
kind: Deployment
metadata:
  name: hopper-broker
  labels:
    app.kubernetes.io/name: hopper
    app.kubernetes.io/instance: hopper
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hopper-0.1.0
spec:
  replicas: 2
  # A new broker answers SERVING before an old one is deleted, so the number of
  # serving brokers never drops below replicas during a rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hopper
      app.kubernetes.io/instance: hopper
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hopper
        app.kubernetes.io/instance: hopper
        app.kubernetes.io/component: broker
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: hopper-0.1.0
      annotations:
        # A ConfigMap change alone restarts nothing; a changed pod template does.
        checksum/config: 752da932502472643b518c3dcf18cb55a7cf14e9c51bde18909f14805b1cfe83
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Without this a cold install crash-loops every broker until PostgreSQL
        # finishes initdb, and CrashLoopBackOff's growing delay stalls --wait.
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -d \"$HOPPER_DSN\" -t 2; do sleep 1; done"]
          envFrom:
            - configMapRef:
                name: hopper-broker
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: broker
          image: ghcr.io/rpasco787/hopper-broker:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hopper-broker
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: hopper-postgres
                  key: password
          ports:
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9091
          # The broker's own grpc.health.v1 service. The port opens only after
          # migrations, so the startup probe holds liveness off until then.
          # Readiness is not database health (Decision 5).
          startupProbe:
            grpc:
              port: 9090
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 9090
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9090
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
