# The benchmark stack (scripts/bench.sh), merged over
# docker-compose.yml as project hopper-bench:
#
#   docker compose -p hopper-bench -f docker-compose.yml -f deploy/bench/compose.yaml ...
#
# scripts/bench.sh builds and tags every image and sets every variable below;
# nothing is pulled. loadgen runs inside the Compose network, so the host's
# port forwarding is in no measured path. Only the brokers' metrics and
# profiling ports are published, on loopback ports no other stack uses.
services:
  postgres:
    # pg_stat_statements attributes database time to statements.
    # synchronous_commit stays on: "off" is a diagnostic, never a result.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements",
              "-c", "synchronous_commit=${HOPPER_BENCH_SYNC_COMMIT:-on}"]

  broker:
    image: hopper-bench/broker:${HOPPER_BENCH_TAG:?set by scripts/bench.sh}
    pull_policy: never
    ports: !override
      - "127.0.0.1:16091:9091"
      - "127.0.0.1:16060:6060"
    environment: &bench-broker-env
      HOPPER_SCHEDULER: "false"
      HOPPER_DEBUG_LISTEN: 0.0.0.0:6060
    # Knobs a run sets, such as HOPPER_DB_MAX_CONNS; empty unless asked for,
    # so a binary keeps its own default.
    env_file: ["${HOPPER_BENCH_BROKER_ENV:?set by scripts/bench.sh}"]

  broker-standby:
    image: hopper-bench/broker:${HOPPER_BENCH_TAG:?set by scripts/bench.sh}
    pull_policy: never
    ports:
      - "127.0.0.1:16092:9091"
      - "127.0.0.1:16061:6060"
    environment: *bench-broker-env
    env_file: ["${HOPPER_BENCH_BROKER_ENV:?set by scripts/bench.sh}"]

  # Workers on `worker` dial `broker` (explicitly, since the base file's
  # workers dial the shared `brokers` name); those on `worker-b` dial
  # `broker-standby`, so a two- or four-broker run splits the load deterministically,
  # one worker service per broker.
  # Workers log at warn by default: their info lines are per job, and the
  # benchmark measures the queue, not the logging pipeline.
  worker:
    image: hopper-bench/worker:${HOPPER_BENCH_TAG:?set by scripts/bench.sh}
    pull_policy: never
    environment: &bench-worker-env
      # Pinned, not brokers:9090: a two-broker run splits workers evenly
      # by service, and round robin's random placement would not.
      # worker-b overrides it.
      HOPPER_BROKER: broker:9090
      HOPPER_CONCURRENCY: "${HOPPER_BENCH_CONCURRENCY:-16}"
      HOPPER_LOG_LEVEL: "${HOPPER_BENCH_WORKER_LOG_LEVEL:-warn}"

  worker-b:
    image: hopper-bench/worker:${HOPPER_BENCH_TAG:?set by scripts/bench.sh}
    pull_policy: never
    depends_on: [broker-standby]
    environment:
      <<: *bench-worker-env
      HOPPER_BROKER: broker-standby:9090
      HOPPER_SHUTDOWN_TIMEOUT: 45s
      HOPPER_METRICS_LISTEN: 0.0.0.0:9092
    stop_grace_period: 60s

  # broker-3 and broker-4 exist only here, for BROKERS=4. YAML anchors don't
  # reach across Compose files, so they repeat x-broker's settings from
  # docker-compose.yml; keep the two in step. They need no network alias:
  # benchmark workers are pinned to one broker each.
  broker-3:
    image: hopper-bench/broker:${HOPPER_BENCH_TAG:?set by scripts/bench.sh}
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment: &bench-extra-broker-env
      <<: *bench-broker-env
      HOPPER_DSN: postgres://hopper:hopper@postgres:5432/hopper?sslmode=disable
      HOPPER_LISTEN: 0.0.0.0:9090
      HOPPER_LEASE_DURATION: 30s
      HOPPER_LOG_LEVEL: info
      HOPPER_METRICS_LISTEN: 0.0.0.0:9091
      HOPPER_METRICS_QUEUES: sleep,fail_n_times,cpu_burn
    ports:
      - "127.0.0.1:16093:9091"
      - "127.0.0.1:16062:6060"
    env_file: ["${HOPPER_BENCH_BROKER_ENV:?set by scripts/bench.sh}"]
    stop_grace_period: 40s

  broker-4:
    image: hopper-bench/broker:${HOPPER_BENCH_TAG:?set by scripts/bench.sh}
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment: *bench-extra-broker-env
    ports:
      - "127.0.0.1:16094:9091"
      - "127.0.0.1:16063:6060"
    env_file: ["${HOPPER_BENCH_BROKER_ENV:?set by scripts/bench.sh}"]
    stop_grace_period: 40s

  # Workers on worker-c and worker-d dial broker-3 and broker-4.
  worker-c:
    image: hopper-bench/worker:${HOPPER_BENCH_TAG:?set by scripts/bench.sh}
    pull_policy: never
    depends_on: [broker-3]
    environment:
      <<: *bench-worker-env
      HOPPER_BROKER: broker-3:9090
      HOPPER_SHUTDOWN_TIMEOUT: 45s
      HOPPER_METRICS_LISTEN: 0.0.0.0:9092
    stop_grace_period: 60s

  worker-d:
    image: hopper-bench/worker:${HOPPER_BENCH_TAG:?set by scripts/bench.sh}
    pull_policy: never
    depends_on: [broker-4]
    environment:
      <<: *bench-worker-env
      HOPPER_BROKER: broker-4:9090
      HOPPER_SHUTDOWN_TIMEOUT: 45s
      HOPPER_METRICS_LISTEN: 0.0.0.0:9092
    stop_grace_period: 60s

  loadgen:
    image: hopper-bench/loadgen:wt
    pull_policy: never
    profiles: ["bench"]
