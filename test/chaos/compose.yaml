# The chaos suite's changes to docker-compose.yml (test/chaos). The suite
# merges this file over the base one:
#
#   docker compose -p hopper-chaos -f docker-compose.yml -f test/chaos/compose.yaml ...
#
# It publishes PostgreSQL and both brokers on loopback ports the suite picks,
# replacing the base file's fixed ones, so the suite can run beside a
# development stack and a restarted container comes back on the port the
# suite's connections expect. Cron is off, so every job is the suite's.
# HOPPER_CHAOS_WORKER_BROKER and HOPPER_CHAOS_STREAM_AGE let a test opt into
# round robin across both brokers and short stream ages.
# HOPPER_CHAOS_CONFIRM_BATCH sets the brokers' confirmation batch size: 64, the broker default, unless given; 1 turns batching off.
# HOPPER_CHAOS_SHUTDOWN_TIMEOUT sets the workers' shutdown budget: 45s, the base file's, unless given.
services:
  postgres:
    ports:
      - "127.0.0.1:${HOPPER_CHAOS_PG_PORT:?set by the chaos suite}:5432"
  broker:
    ports: !override
      - "127.0.0.1:${HOPPER_CHAOS_BROKER_PORT:?set by the chaos suite}:9090"
    environment:
      HOPPER_SCHEDULER: "false"
      HOPPER_CONFIRM_BATCH: ${HOPPER_CHAOS_CONFIRM_BATCH:-64}
      HOPPER_LEASE_STREAM_MAX_AGE: ${HOPPER_CHAOS_STREAM_AGE:-5m}
      HOPPER_MAX_CONNECTION_AGE: ${HOPPER_CHAOS_STREAM_AGE:-5m}
  broker-standby:
    ports:
      - "127.0.0.1:${HOPPER_CHAOS_STANDBY_PORT:?set by the chaos suite}:9090"
    environment:
      HOPPER_SCHEDULER: "false"
      HOPPER_CONFIRM_BATCH: ${HOPPER_CHAOS_CONFIRM_BATCH:-64}
      HOPPER_LEASE_STREAM_MAX_AGE: ${HOPPER_CHAOS_STREAM_AGE:-5m}
      HOPPER_MAX_CONNECTION_AGE: ${HOPPER_CHAOS_STREAM_AGE:-5m}
  worker:
    environment:
      # The restart tests need to know which broker every worker is on, so
      # workers dial `broker` unless a test opts into the shared name.
      HOPPER_BROKER: ${HOPPER_CHAOS_WORKER_BROKER:-broker:9090}
      # The base file's budget unless a test sets its own: the conformance
      # suite's shutdown-deadline scenario uses 2s.
      HOPPER_SHUTDOWN_TIMEOUT: ${HOPPER_CHAOS_SHUTDOWN_TIMEOUT:-45s}
