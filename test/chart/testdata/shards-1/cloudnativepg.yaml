---
# Source: hopper/templates/broker-pdb.yaml
# Voluntary evictions (node drains) take at most one broker at a time. Not
# rendered for one replica, where a budget would block every drain forever.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hopper-broker
  labels:
    app.kubernetes.io/name: hopper
    app.kubernetes.io/instance: hopper
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hopper-0.1.0
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hopper
      app.kubernetes.io/instance: hopper
      app.kubernetes.io/component: broker

---
# Source: hopper/templates/postgres-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: hopper-postgres
  labels:
    app.kubernetes.io/name: hopper
    app.kubernetes.io/instance: hopper
    app.kubernetes.io/component: postgres
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hopper-0.1.0
# CloudNativePG creates the database owner from this at bootstrap, and reads
# it only in this shape.
type: kubernetes.io/basic-auth
stringData:
  username: "hopper"
  password: "hopper"

---
# Source: hopper/templates/broker-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hopper-broker
  labels:
    app.kubernetes.io/name: hopper
    app.kubernetes.io/instance: hopper
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hopper-0.1.0
data:
  # No password here: the broker reads it from the Secret as PGPASSWORD, which
  # pgx uses for any connection string that does not carry one.
  HOPPER_DSN: "postgres://hopper@hopper-db-rw:5432/hopper?sslmode=disable"
  HOPPER_LISTEN: ":9090"
  HOPPER_METRICS_LISTEN: ":9091"
  HOPPER_METRICS_QUEUES: "sleep,fail_n_times,cpu_burn"
  HOPPER_LEASE_DURATION: "30s"
  HOPPER_LOG_LEVEL: "info"
  HOPPER_SCHEDULER: "true"
  HOPPER_SHUTDOWN_TIMEOUT: "30s"

---
# Source: hopper/templates/worker-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hopper-worker
  labels:
    app.kubernetes.io/name: hopper
    app.kubernetes.io/instance: hopper
    app.kubernetes.io/component: worker
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hopper-0.1.0
data:
  # Every value is quoted: ConfigMap data must be strings, and the API server
  # rejects a bare number that helm template would happily render.
  HOPPER_BROKER: "hopper-broker-headless:9090"
  HOPPER_CONCURRENCY: "8"
  HOPPER_SHUTDOWN_TIMEOUT: "45s"
  HOPPER_LOG_LEVEL: "info"
  HOPPER_METRICS_LISTEN: ":9092"

---
# Source: hopper/templates/broker-headless-service.yaml
# Headless: this name resolves to every ready broker pod, so the worker SDK's
# round_robin connects to all of them, sends each heartbeat and confirmation
# to the next, and opens each new lease stream on the next. Streams spread
# back out after a broker restart as they reach -lease-stream-max-age. The
# ClusterIP Service beside it stays for metrics scraping.
apiVersion: v1
kind: Service
metadata:
  name: hopper-broker-headless
  labels:
    app.kubernetes.io/name: hopper
    app.kubernetes.io/instance: hopper
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hopper-0.1.0
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: hopper
    app.kubernetes.io/instance: hopper
    app.kubernetes.io/component: broker
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc

---
# Source: hopper/templates/broker-service.yaml
# ClusterIP: one stable address for metrics scraping and for anything that
# wants a single endpoint. Workers dial the headless Service instead, so they
# reach every broker (see broker-headless-service.yaml). The named metrics port is
# what a ServiceMonitor selects.
apiVersion: v1
kind: Service
metadata:
  name: hopper-broker
  labels:
    app.kubernetes.io/name: hopper
    app.kubernetes.io/instance: hopper
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hopper-0.1.0
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hopper
    app.kubernetes.io/instance: hopper
    app.kubernetes.io/component: broker
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: metrics
      port: 9091
      targetPort: metrics

---
# Source: hopper/templates/broker-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hopper-broker
  labels:
    app.kubernetes.io/name: hopper
    app.kubernetes.io/instance: hopper
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hopper-0.1.0
spec:
  replicas: 2
  # A new broker answers SERVING before an old one is deleted, so the number of
  # serving brokers never drops below replicas during a rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hopper
      app.kubernetes.io/instance: hopper
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hopper
        app.kubernetes.io/instance: hopper
        app.kubernetes.io/component: broker
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: hopper-0.1.0
      annotations:
        # A ConfigMap change alone restarts nothing; a changed pod template does.
        checksum/config: 149822ab2341f856db7fa71d400ac3ce5e042f9b4eb0b1ced7bf396e8edc876b
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Without this a cold install crash-loops every broker until PostgreSQL
        # finishes initdb, and CrashLoopBackOff's growing delay stalls --wait.
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -d \"$HOPPER_DSN\" -t 2; do sleep 1; done"]
          envFrom:
            - configMapRef:
                name: hopper-broker
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: broker
          image: ghcr.io/rpasco787/hopper-broker:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hopper-broker
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: hopper-postgres
                  key: password
          ports:
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9091
          # The broker's own grpc.health.v1 service. The port opens only after
          # migrations, so the startup probe holds liveness off until then.
          # Readiness is not database health (Decision 5).
          startupProbe:
            grpc:
              port: 9090
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 9090
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9090
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # The native sleep action: the image has no shell and no sleep
            # binary, so an exec hook would fail and skip the delay. The delay
            # lets endpoint removal reach kube-proxy before the broker drains.
            preStop:
              sleep:
                seconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

---
# Source: hopper/templates/worker-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hopper-worker
  labels:
    app.kubernetes.io/name: hopper
    app.kubernetes.io/instance: hopper
    app.kubernetes.io/component: worker
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hopper-0.1.0
spec:
  replicas: 1
  # Surge first, so a replacement pod exists before an old one is deleted.
  # With no readiness probe, "ready" means only that the container started,
  # so this orders the pods; it does not promise the new worker is leasing.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hopper
      app.kubernetes.io/instance: hopper
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hopper
        app.kubernetes.io/instance: hopper
        app.kubernetes.io/component: worker
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: hopper-0.1.0
      annotations:
        # A ConfigMap change alone restarts nothing; a changed pod template does.
        checksum/config: c0eccc9a65982ae7d5c99eb88eaee361e588d3e7f1d0f4d0163c32b037e8423c
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # No probes: the SDK reconnects on its own, so a restart would not help
        # a worker that cannot reach a broker (Decision 5).
        - name: worker
          image: ghcr.io/rpasco787/hopper-worker:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hopper-worker
          ports:
            - name: metrics
              containerPort: 9092
          lifecycle:
            # Nothing routes to a worker, so this sleep only delays SIGTERM, during
            # which the worker keeps taking work. Harmless, and counted in the grace
            # budget (Decision 4).
            preStop:
              sleep:
                seconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

---
# Source: hopper/templates/postgres-cluster.yaml
# A replicated PostgreSQL run by the CloudNativePG operator. Brokers reach the
# primary through <name>-rw, which the operator moves on failover.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hopper-db
  labels:
    app.kubernetes.io/name: hopper
    app.kubernetes.io/instance: hopper
    app.kubernetes.io/component: postgres
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hopper-0.1.0
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.16-standard-bookworm
  bootstrap:
    initdb:
      database: "hopper"
      owner: "hopper"
      secret:
        name: hopper-postgres
  # A commit returns only after this many standbys have flushed it, so a
  # failover to the most advanced standby keeps every acknowledged commit.
  # required: with too few standbys, commits wait rather than go asynchronous.
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
  storage:
    size: 1Gi
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
---
# Source: hopper/templates/tests/smoke-pod.yaml
# helm test: one job through the Service, the database and a worker (Decision 10).
apiVersion: v1
kind: Pod
metadata:
  name: hopper-smoke
  labels:
    app.kubernetes.io/name: hopper
    app.kubernetes.io/instance: hopper
    app.kubernetes.io/component: smoke
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hopper-0.1.0
  annotations:
    helm.sh/hook: test
    # Kept after it runs, so `helm test --logs` and kubectl can read it.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: ghcr.io/rpasco787/hopperctl:0.1.0
      imagePullPolicy: IfNotPresent
      args:
        - smoke
        - "-broker=hopper-broker:9090"
        - "-queue=sleep"
        - "-payload={\"ms\":10}"
        - "-timeout=60s"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]

